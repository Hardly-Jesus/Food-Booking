# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI Pipeline

on:
  push:
    branches:
      - Dev
      - QA
      - main

  pull_request:
    branches:
      - Dev
      - QA
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias
        run: |
          dotnet clean ./ReservaBook/ReservaBook.sln
          dotnet restore ./ReservaBook/ReservaBook.sln

      - name: Compilar proyecto
        run: dotnet build ./ReservaBook/ReservaBook.sln --no-restore --configuration Release

      - name: Ejecutar pruebas unitarias
        run: dotnet test ./ReservaBook --no-build --configuration Release --logger trx

