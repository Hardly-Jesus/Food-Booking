<main class="flex-grow-1 container py-4">
    
        <div class="container d-flex justify-content-center mt-5 mb-5">
        <div class="col-12 col-sm-6 col-md-6"> 
        <div class="card">
        <div class="card-header bg-primary opacity-75">
                    <h4 class="text-center text-light fw-bold">New Restaurante</h4>
        </div>
        <div class="card-body bg-light fw-bold form-registro">
        <form id="form-update-restaurante" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="Name" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="Name" name="nombre" placeholder="Ej: Restauran Resf-chino" required>
                          </div>

                            <div class="mb-3">
                                <label for="direccion" class="form-label">Direccion</label>
                                <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Ej: Calle duarte #90">
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">telefono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej: 829-000-1218">
                            </div>


                            <div class="mb-3">
                                <label for="HoraInicio" class="form-label">Hora inicio</label>
                                <input type="time" class="form-control" id="HoraInicio" name="horarioInicio" required>
                            </div>



                              <div class="mb-3">
                                <label for="HoraFin" class="form-label">Hora final</label>
                                <input type="time" class="form-control" id="HoraFin" name="horarioFin" required>
                            </div>

                                
                              <div class="mb-3" id="">
                                 <label for="gastronomia" class="form-label">Especialidad Gastronomica</label>
                                 <input type="text" class="form-control" id="gastronomia" name="especialidadGastronomica" placeholder="ej: Comida china" required>
                             </div>
                            

                             
                             <div class="mb-3">
                                <label for="imagen" class="form-label">Imagen del restaurante</label>
                                <input type="file" class="form-control" id="imagen">
                             </div>

                              <div class="mt-3">
                                <button id="btn-restaurante-submit" type="submit" class="btn btn-outline-primary float-end">Save <i class="bi bi-bookmark-plus-fill"></i></button>
                                <a href="/Assets/view/Propietario/restaurante/Restaurantes.html" class="btn btn-outline-warning float-end me-3">  Back to list  <i class="bi bi-skip-backward-btn-fill"></i></a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
