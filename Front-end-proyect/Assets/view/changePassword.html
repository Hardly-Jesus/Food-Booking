<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetea tu contraseña</title>
    <link rel="stylesheet" href="/Assets/css/lib/bootStrap/bootstrap.min.css">
    <link rel="stylesheet" href="/Assets/css/site/main.css">
</head>
<body>
    <main class="container d-flex justify-content-center align-items-center" style="height:100vh;">
        
        <div class="col-12 col-sm-8 col-md-6">
            <div class="card shadow p-4 text-center bg-success text-dark" id="container-message">
                <h2 class="fw-bold mb-4">✔ cambia tu contraseña</h2>
                <p>Por favor ingresa la nueva contraseña!, verifica que cumplas los requisitos</p>
                <div class="mb-3">
                    <div class="error mt-2 mb-2" id="change-password-NotEspecific"></div>  
                    <form id="change-password-form" class="form-resset">    
                    <label for="password" class="form-label fw-bold">New Password</label>
                    <input type="password" id="password" class="form-control" placeholder="ej: User@123" >
                    <small class="error error-password" id="error-password"></small>
                     <div class="mt-3">
                         <button type="submit" class="btn btn-outline-warning fw-bold">Cambiar contraseña</button>
                     </div>
                 </form>
                </div> 
                
            </div>
        </div>
    </main>   
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="/Assets/js/lib/bootStrap/bootstrap.min.js"></script>
    <script src="/Assets/js/site/validateChangePassword.js"></script>
</body>
</html>
