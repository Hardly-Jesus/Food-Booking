<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="esta pagina mostrara el login para acceder a la web">
    <title>Login web</title>
    <link rel="stylesheet" href="/Assets/css/lib/bootStrap/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/Assets/css/site/main.css">
</head>
<body class="d-flex flex-column min-vh-100"> 
  <header>
     <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="Login.html">food App <i class="bi bi-egg-fried"></i></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
         <a class="nav-link active" aria-current="page" href="Login.html">
              Login <i class="bi bi-box-arrow-in-right"></i>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
  </header>    
    <main class="flex-grow-1 container py-4">
         
          <div class="container d-flex justify-content-center mt-5 mb-5">
           <div class="col-12 col-sm-6 col-md-6">
                 <div class="card">
                    <div class="card-header bg-dark opacity-75">
                        <h4 class="text-center text-light fw-bold">Iniciar Session</h4>
                    </div>
                    <div class="card-body form-iniciar">
                          <div id="error-no-especifico" class="error error-notEspecifico"></div>
                          <div id="message-success" class="message-success"></div>
                         <form id="login-form">
                            <div class="mb-3">
                                <label for="UserName" class="form-label">Nombre de usuario</label>
                                <input type="text" class="form-control" id="UserName" placeholder="Ej: Usuario1">
                                <small id="error-userName" class="error"></small>
                            </div>
                            <div class="mb-3">
                                <label for="Password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="Password" placeholder="Ej: usuer@123">
                                <small id="error-password" class="error"></small>
                            </div>
                            <div class="mt-3">
                                <button id="btn-login-submit" type="submit" class="btn btn-outline-success float-end">Iniciar <i class="bi bi-person-check me-2"></i></button>
                                <a id="btn-login-resset" href="registro.html" class="btn btn-outline-warning float-end me-3">Registrarse <i class="bi bi-person-plus"></i></a>
                                <a href="/Assets/view/RessetPasword.html" id="link-foorgot-password" class="link float-end me-5">Foorget password</a>
                            </div>
                        </form>
                    </div>
                 </div>    
               </div>
           </div>
    </main>
     <footer class="bg-dark text-light text-center py-3 mt-auto">
    <div class="container"> 
    <p class="mb-1">
    <i class="bi bi-egg-fried"></i> Food App <i class="bi bi-heart-fill text-danger"></i>   
     <small>© 2026 Todos los derechos reservados </small>
    </p>
  </div>
  </footer>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="/Assets/js/lib/bootStrap/bootstrap.min.js"></script>
    <script src="/Assets/config/urlApi.js"></script>
    <script src="/Assets/js/site/main.js"></script>
</body>
</html>
